name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: cmd
        run: build.cmd
      - name: Self-test
        shell: pwsh
        run: |
          $p = Start-Process .\AJ139Tray.exe --selftest -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "selftest failed (exit $($p.ExitCode))" }
      - uses: actions/upload-artifact@v4
        with:
          name: AJ139Tray
          path: AJ139Tray.exe
